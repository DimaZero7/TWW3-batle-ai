<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Разметка</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <b class="brand">Разметка</b>
  <nav id="steps">
    <button data-step="1"><i>1</i> Армии</button>
    <button data-step="2"><i>2</i> Карта</button>
    <button data-step="3"><i>3</i> Расстановка</button>
    <button data-step="4"><i>4</i> Роль</button>
    <button data-step="5"><i>5</i> В бой</button>
    <button data-step="6" id="step-game" title="бой в настоящей игре: ты — стратег и оперативник"><i>▶</i> Игра</button>
  </nav>
  <span id="battlebar" class="hidden">
    <span id="clock"></span>
    <button data-mode="pause" title="пауза (пробел)">⏸ пауза</button>
    <button data-mode="x1" title="обычная скорость">▶ ×1</button>
    <button data-mode="x4" title="быстро">▶▶ ×4</button>
    <button data-mode="decision" title="без остановок до следующего решения">⏭ до решения</button>
    <button id="btn-stop" title="закончить бой сейчас">■ закончить</button>
  </span>
  <span id="status"></span>
</header>
<main>
  <div id="view">
    <canvas id="cv"></canvas>
    <div id="builder" class="overlay hidden"></div>
    <div id="mappick" class="overlay hidden"></div>
    <div id="tip" class="hidden"></div>
    <div id="replay" class="hidden"><span>Запись боя:</span><input id="replay-t" type="range" min="0" max="0" value="0"><span id="replay-l"></span></div>
    <div id="keys"></div>
  </div>
  <aside id="panel">
    <section id="p-setup"></section>
    <section id="p-battle" class="hidden">
      <div id="banner"></div>
      <div id="decision" class="hidden">
        <ol id="d-steps" class="steps"></ol>
        <div id="d-body"></div>
        <div id="d-err" class="err hidden"></div>
        <div id="d-warn" class="warn hidden"></div>
        <div class="row buttons">
          <button id="btn-hint" title="показать решение формулы полупрозрачно">Показать подсказку формулы</button>
          <button id="btn-take" title="взять решение формулы как своё">Принять подсказку</button>
          <button id="btn-reset" title="вернуть то, что в силе">Сбросить</button>
        </div>
        <button id="btn-next" class="big go wide" title="записать решение и дальше (Enter)">Дальше ▶</button>
      </div>
      <div id="b-info" class="hint"></div>
      <div id="result" class="hidden"></div>
    </section>
  </aside>
</main>
<script src="app.js"></script>
</body>
</html>
