# All tests on every push (docs/ru/testing/tests.md): modules, entry points,
# the architecture and docs rules, the build. Lua 5.1 runs inside Python
# (lupa), no game needed.
name: tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
