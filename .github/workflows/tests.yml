# All tests on every push (docs/ru/architecture/ai-design.md, 5.1 rule 9):
# modules, the tree's branches, the architecture rules and the simulator's
# golden runs. Lua 5.1 runs inside Python (lupa), no game needed.
name: tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
