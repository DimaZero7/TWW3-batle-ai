# The host's tests on every push (no game, no torch: the *_torch tests skip): the smoke tests of the areas, Lua 5.1
# inside Python (lupa). All of them, torch too: bash ops/dock.sh pytest -q (the image snake-ai-trainer, ops/README.md).
name: tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
