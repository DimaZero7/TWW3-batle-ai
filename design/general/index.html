<style>

}

  --done:#46c58b; --done-bg:#12301f; --open:#f0b54a; --open-bg:#33270e; --later:#9fb0cc; --later-bg:#1f2633;
  --field:#6f8a45; --out:#4a4f58; --block:#8b7460; --mine:#2fae78; --minev:#2c6b52; --foe:#e2645a; --foev:#7a3b36; --neutral:#2a3038; color-scheme:dark}}
:root[data-theme="dark"]{

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;

<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:8px">
    <h1>Генерал: архитектура</h1>
    <p class="muted">Рабочая страница S28. Нажми на блок — под ним откроется описание. Здесь только то, о чём договорились.</p>
  </header>

  <section class="net" aria-label="Схема сети генерала">
    <div class="types"><span class="tl">Типы блоков:</span>
      <span class="ty t-in">вход</span><span class="ty t-proc">обработка</span><span class="ty t-out">выход</span><span class="ty t-test">проверка</span>
    </div>
    <div class="blocks">
      <div class="nodestack" style="grid-column:3;grid-row:1">
        <button class="node t-test" data-n="maptest" type="button">Проверки анализа карты</button>
        <span class="vlink">┆</span>
      </div>
      <button class="node t-in" data-n="landscape" type="button" style="grid-column:1;grid-row:2">Ландшафт</button>
      <span class="barrow" style="grid-column:2;grid-row:2">→</span>
      <button class="node t-proc" data-n="mapproc" type="button" style="grid-column:3;grid-row:2">Анализ карты</button>
      <button class="node t-in" data-n="armies" type="button" style="grid-column:1;grid-row:3">Армии</button>
    </div>
  </section>
  <div class="crumbs" id="crumbs"></div>

  <main id="content"></main>
</div>

<template id="tpl-landscape">
  <section class="cards">
    <div>
      <div class="colh">Решено</div>
      <div class="box done">
        <h2>Карта <span class="chip done">решено</span></h2>
        <div class="ginfo"><b>Общее</b>
        <ul class="small">
          <li>Клетка всегда 16 м. Сетка 128×128 клеток (= 2048 м): влезает любая полевая карта и наша арена с краем для бегущих (±1020 м). Типичная карта 1024 м занимает середину 64×64. Клетки «за картой» окружают карту со всех сторон — край виден везде.</li>
          <li>В памяти: доли типов (по байту на тип) + 4 флага зон в одном байте; сейчас 3 байта на клетку, ~28 КБ на карту. На входе в сеть — слои долей + 4 слоя флагов (на мгновение, один раз на карту).</li>
          <li><b>Карта всегда «от своей стороны».</b> Для второй стороны карта зеркалится, и «наша / врага» меняются местами — генерал всегда видит себя с одной стороны (как сеть отрядов сейчас).</li>
          <li><b>Учения:</b> бои там сдвинуты по карте, поэтому слои считаются для каждого боя на лету (это дёшево).</li>
          <li>Запретная полоса вокруг зоны — 64 м (данные игры: 210 из 257 зон).</li>
        </ul></div>
        <details class="lgroup" open>
          <summary>Слои карты — 6: местность (1–2) и развёртывание (3–6)</summary>
        <div class="layers">
          <details class="lsub">
            <summary><span class="ln">Местность · слои 1–2</span><span class="kind">доли типов в клетке, сумма = 1</span></summary>
            <div class="layers sub">
              <details class="lacc">
                <summary><span class="ln">Слой 1 · поле</span><span class="kind">доля 0…1 → числом</span></summary>
                <div class="lrow">
                  <div class="gwrap"><div class="grid" data-g="t1" aria-label="Поле"></div><div class="zoomcap">одна клетка (жёлтая рамка на карте), разрезанная на мелкие кусочки; пунктир — край карты:</div><div class="zoom" data-zoom="t1"></div><div class="zoomcap" data-zlbl="t1"></div></div>
                  <div class="linfo">
                    <b>Слой 1 · поле</b>

            <li><b>«За картой» со всех сторон, а не только справа и снизу.</b> Иначе у левого и верхнего края сеть не видит, что дальше хода нет. <i>Отвергнуто.</i></li>
            <li><b>Зоны — флаги «целиком внутри», а не доли.</b> Частичные клетки на краях и скруглённых углах зон считаются «нет» — зона чуть меньше (до 16 м по краю), зато в «да»-клетку точно можно ставить. Доли для зон отвергнуты: точность не нужна. «Больше половины — да» отвергнуто: отряд мог бы встать за пределами зоны.</li>
            <li><b>Зеркало для второй стороны</b>, а не только обмен «наша/врага»: иначе генерал учит два направления («мы слева», «мы справа») — вдвое дольше. <i>Без зеркала — отвергнуто.</i></li>
            <li><b>Полоса 64 м, а не 42:</b> 42 было ошибкой прошлого разбора; файлы карт игры дают 64 м.</li>
            <li><b>«За картой» — отдельный тип, не «непроходимо».</b> Пройти нельзя в обоих случаях, но за край бегущие уходят и выходят из боя насовсем, а дом или обрыв они обегают и остаются; за краем ничего нет. Разная механика — разные типы.</li>
            <li><b>Местность — доли, а не один тип на клетку.</b> «Кто больше места» теряет мелкие препятствия и смешанный край; «любое препятствие» закрывает проходы. Доли — величины, подаются числами. <i>Один тип на клетку — отвергнуто для генерала</i> (останется для подробной карты отрядов 2 м, там номер через словарик).</li>
            <li><b>Типы по механике, а не по виду.</b> Руины и обрыв — оба «нельзя пройти» (если механика одинаковая), разводить их незачем.</li>
            <li><b>128×128, а не 96×96:</b> у нашей арены край, где бегущие уходят с поля, — ±1020 м (2040 м), а 96×96 покрывало только 1536 м: генерал не видел бы край и отряды у края. 128×128 вмещает и любые полевые карты игры (до 1536×1792). <i>96×96 — отвергнуто.</i></li>
          </ul>
        </details>
        <ul class="small" style="display:none">
          <li>Оба слоя — ярлыки, идут через словарик.</li>
          <li>Карта хранится один раз на карту, сводка считается один раз.</li>
        </ul>
      </div>

                <li><b>Мёртвые нейроны</b> — признак всегда 0 на любой карте. Лечение: другая функция включения, меньше шаг обучения.</li>
                <li><b>Тесно</b> — все 32 признака заняты и по-настоящему разные. Лечение: расширить до 64.</li>
                <li><b>Двойники</b> — признаки повторяют друг друга (таблица похожести).</li>
                <li><b>Используется ли карта</b> — подменили карту: меняются ли решения генерала; доходит ли до модуля сигнал обучения.</li>

              <div class="tlist"><ul class="small">

                <li><b>Не съело ли сжатие мелочь</b> — карта с узким проходом против карты без него: отличает ли сводка.</li>
                <li><b>Опыт с размером</b> — 32 против 64 признаков, одинаковое время обучения.</li>
              </ul></div></details>

        <h2>Слоты армий <span class="chip done">решено</span></h2>
        <div class="ginfo"><b>Общее</b>
        <ul class="small">
          <li><b>80 слотов: 40 наших + 40 врага.</b> Это наибольший размер боя: больше отрядов в бою не бывает.</li>
          <li><b>Один слот — один отряд</b> (лорд, герой, пехота, стрелки…).</li>
          <li>Отрядов меньше 40 — остальные слоты <b>пустые</b>: у них флаг «пусто», и сеть их не читает.</li>
          <li><b>Без места, направления, текущей скорости и расстояний до краёв карты.</b> Генерал решает до расстановки — отряды ещё не стоят на поле.</li>
          <li><b>Скорость как характеристика — берём</b> из паспорта: шаг, бег, натиск.</li>
          <li><b>Без состояния в бою</b> (бойцы и здоровье «от начала боя», мораль, в рукопашной / идёт / бежит / стреляет; подробно: точная мораль и её ступени, осталось стрел, убито врагов, усталость; приказы; угрозы флангам и тылу, недавняя рукопашная и бегство): до боя всё на начальных значениях. Полный размер отряда и его здоровье — в паспорте.</li>
          <li><b>Новое: «пришло в бой»</b> — доля бойцов и доля здоровья от полного отряда (2 числа). В наших боях обе = 1; нужно, когда отряд приходит неполным (кампания). Здоровье отдельно, потому что у одиночек (лорд, монстр) бойцов всегда 1 из 1, а раны видны только по здоровью.</li>
        </ul></div>

      x.setLineDash([]);
      if(mode===4){x.save();x.translate(0,cv.height);x.scale(1,-1);x.restore();}
    });
    var zz={z1:function(x,y){return y>=H-3;},z2:function(x,y){return y<=2;},z3:function(x,y){return y>3;},z4:function(x,y){return y<H-4;}};
    var zc={z1:"var(--mine)",z2:"var(--foe)",z3:"var(--minev)",z4:"var(--foev)"};
    Object.keys(zz).forEach(function(k){var el=c.querySelector('[data-g="'+k+'"]');if(el)fillGrid(el,function(x,y){return (!out(x,y)&&zz[k](x,y))?zc[k]:"var(--neutral)";},W,H);});
    if(g2)fillGrid(g2,function(x,y){if(out(x,y))return "var(--neutral)";if(y<=2)return "var(--foe)";if(y>=H-3)return "var(--mine)";return "var(--neutral)";},W,H);
    if(f)fillGrid(f,function(x,y){return (x>=4&&y>=4)?"var(--block)":"var(--field)";},8,8);
    var hm=c.querySelector('[data-g="heat"]');
    if(hm){
      var HW=14,HH=10,feat=[],kind=[];
      for(var y=0;y<HH;y++)for(var x=0;x<HW;x++){var forest=(x>=2&&x<=5&&y>=2&&y<=6),hill=((x-10)*(x-10)+(y-3)*(y-3)<=5);
        kind.push(forest?1:(hill?2:0));feat.push([forest||hill?0:1, forest?1:0, hill?1:0]);}
      var units=[{n:"кавалерия",q:[1,-0.6,0],ans:"Кавалерия смотрит на открытое поле: там ей разгоняться. В доклад попадает: «поле большое, лес слева мешает»."},
                 {n:"стрелки",q:[0,0.4,1],ans:"Стрелки смотрят на холм (дальше бьют) и чуть на лес (укрытие). В доклад: «холм справа — хорошая позиция»."},
                 {n:"лёгкая пехота",q:[0,1,0.2],ans:"Лёгкая пехота смотрит на лес: там её не достанут стрелы и кавалерия. В доклад: «лес слева — укрытие»."}];
      var ui=c.__u||0;
      var ut=c.querySelector('[data-units]');[].slice.call(ut.querySelectorAll("button")).forEach(function(b){b.remove();});
      units.forEach(function(u,i){var b=document.createElement("button");b.type="button";b.textContent=u.n;if(i===ui)b.classList.add("on");b.addEventListener("click",function(){c.__u=i;draw(c);});ut.appendChild(b);});
      var u=units[ui],sc=feat.map(function(f){return 3*(f[0]*u.q[0]+f[1]*u.q[1]+f[2]*u.q[2]);}),mx=Math.max.apply(null,sc);
      var ex=sc.map(function(s){return Math.exp(s-mx);}),tot=ex.reduce(function(a,b){return a+b;},0),w=ex.map(function(e){return e/tot;}),wm=Math.max.apply(null,w);
      var base=["var(--field)","var(--mine)","var(--block)"],s2="";
      for(var k=0;k<HW*HH;k++){var a=w[k]/wm;s2+='<i style="background:'+base[kind[k]]+';box-shadow:inset 0 0 0 '+(a>0.15?Math.max(1,Math.round(a*4)):0)+'px var(--open);opacity:'+(0.35+0.65*a).toFixed(2)+'"></i>';}
      hm.innerHTML=s2;
      c.querySelector('[data-q]').textContent="«Вопрос» отряда «"+u.n+"»:";
      var qn=["хочу открытое","хочу укрытие","хочу высоту"];
      c.querySelector('[data-qbars]').innerHTML=u.q.map(function(v,i){var p=Math.abs(v)*100;return '<div class="b"><span>'+qn[i]+'</span><div class="track"><i style="width:'+p+'%;background:'+(v>=0?'var(--done)':'var(--foe)')+'"></i></div><span class="v">'+(v>=0?'+':'')+v.toFixed(1)+'</span></div>';}).join("");
      c.querySelector('[data-ans]').textContent=u.ans;
    }
    var z=c.querySelector('[data-g="zones"]');
    if(z){var ZW=14,ZH=10,s="";for(var y=0;y<ZH;y++)for(var x=0;x<ZW;x++){
      var foe=y<=1, mine=y>=ZH-2, foeBand=y<=2, mineBand=y>=ZH-3;
      var ourV=!foeBand, foeV=!mineBand, col;
      if(foe)col="var(--foe)";else if(mine)col="var(--mine)";else if(ourV&&foeV)col="linear-gradient(135deg,var(--minev) 50%,var(--foev) 50%)";else if(ourV)col="var(--minev)";else col="var(--foev)";
      s+='<i style="background:'+col+'"></i>';}z.innerHTML=s;}
  }
  render();
})();
