<script>
(function(){
  // the general's network drawn the way neural nets are drawn: no boxes, faint type tints, projections between parts

  // --- Ландшафт: a small map, square cells
  var C=12,P=2,GX=40,GY=74,NX=14,NY=10,land="";
  function cc(x,y){if(x===0||y===0||x===NX-1||y===NY-1)return "--out";if(y<=2&&x>=4&&x<=9)return "--foe";if(y>=NY-3&&x>=4&&x<=9)return "--mine";return "--field";}

  // --- Анализ карты: stacks shrinking + tiles

     '<path d="M'+(TX-96)+' 23l5 5 8-10" fill="none" stroke="var(--tc)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'+

    var e2=i>=10;arm+='<rect x="'+(ax+84)+'" y="'+(AY+18+i*11)+'" width="64" height="8" rx="3" fill="color-mix(in srgb,var(--foe) '+(e2?16:62)+'%,transparent)"/>';}

  h+=G("armies","t-in",[GX-14,AY-10,LW+28,12*11+90],"Армии","вход",arm);

  var BX=PX0,BY=AY-10,BH=12*11+90,PW=PW0,OBX=OX0,OBW=OW0,ar="";
  function vstk(x,y,w,hh,n){var o="";for(var i=n-1;i>=0;i--)o+='<rect x="'+(x+i*7)+'" y="'+(y-i*7)+'" width="'+w+'" height="'+hh+'" rx="4" fill="color-mix(in srgb,var(--ink) '+(6+i*5)+'%,var(--panel))" stroke="color-mix(in srgb,var(--ink) 30%,var(--panel))" stroke-width="1"/>';return o;}

  // projections: a slot -> layer 1 -> layer 2 -> its card
  var sl={x:ax,y:AY+18+2*11,w:64,h:8};
  var pr='<rect x="'+(sl.x-1.5)+'" y="'+(sl.y-1.5)+'" width="'+(sl.w+3)+'" height="'+(sl.h+3)+'" fill="none" stroke="var(--open)" stroke-width="2" rx="3"/>';
  function pj(A,B){var o="";for(var q=0;q<4;q++)o+='<line x1="'+A[q][0]+'" y1="'+A[q][1]+'" x2="'+B[q][0]+'" y2="'+B[q][1]+'"/>';return o;}

        <details class="why">
          <summary>Почему так и что отвергли</summary>
          <ul class="small">
            <li><b>Клетка всегда 16 м, а не «любая карта в 64×64».</b> Если растягивать, на маленькой карте клетка 8 м, на большой 24 м — сеть путает расстояния. <i>Отвергнуто.</i></li>
            <li><b>«За картой» со всех сторон, а не только справа и снизу.</b> Иначе у левого и верхнего края сеть не видит, что дальше хода нет. <i>Отвергнуто.</i></li>
            <li><b>Зоны — флаги «целиком внутри», а не доли.</b> Частичные клетки на краях и скруглённых углах зон считаются «нет» — зона чуть меньше (до 16 м по краю), зато в «да»-клетку точно можно ставить. Доли для зон отвергнуты: точность не нужна. «Больше половины — да» отвергнуто: отряд мог бы встать за пределами зоны.</li>
            <li><b>Зеркало для второй стороны</b>, а не только обмен «наша/врага»: иначе генерал учит два направления («мы слева», «мы справа») — вдвое дольше. <i>Без зеркала — отвергнуто.</i></li>
            <li><b>Полоса 64 м, а не 42:</b> 42 было ошибкой прошлого разбора; файлы карт игры дают 64 м.</li>
            <li><b>«За картой» — отдельный тип, не «непроходимо».</b> Пройти нельзя в обоих случаях, но за край бегущие уходят и выходят из боя насовсем, а дом или обрыв они обегают и остаются; за краем ничего нет. Разная механика — разные типы.</li>
            <li><b>Местность — доли, а не один тип на клетку.</b> «Кто больше места» теряет мелкие препятствия и смешанный край; «любое препятствие» закрывает проходы. Доли — величины, подаются числами. <i>Один тип на клетку — отвергнуто для генерала</i> (останется для подробной карты отрядов 2 м, там номер через словарик).</li>
            <li><b>Типы по механике, а не по виду.</b> Руины и обрыв — оба «нельзя пройти» (если механика одинаковая), разводить их незачем.</li>
            <li><b>128×128, а не 96×96:</b> у нашей арены край, где бегущие уходят с поля, — ±1020 м (2040 м), а 96×96 покрывало только 1536 м: генерал не видел бы край и отряды у края. 128×128 вмещает и любые полевые карты игры (до 1536×1792). <i>96×96 — отвергнуто.</i></li>
          </ul>
        </details>
        <ul class="small" style="display:none">
          <li>Оба слоя — ярлыки, идут через словарик.</li>
          <li>Карта хранится один раз на карту, сводка считается один раз.</li>
        </ul>

<template id="tpl-armyproc">
  <section class="cards">
    <div>
      <div class="colh">Решено</div>
      <div class="box done">
        <h2>Анализ армий <span class="chip done">решено</span></h2>
        <div class="ginfo"><b>Что это</b>
        <ul class="small">
          <li><b>Читатель отряда</b> — маленькая полносвязная сеть из 2 слоёв: каждое число слота влияет на каждый нейрон первого слоя, каждый нейрон первого — на каждый нейрон второго.</li>
          <li><b>Одна сеть на все 80 слотов</b> — одни и те же веса для своих и врага. Не 80 сетей: каждый отряд проходит через те же нейроны (на схеме — три отряда разными цветами через общую середину). Один бой даёт ей 80 примеров.</li>
          <li><b>Вход</b> — 62 числа слота; каста, размер и тип траектории идут метками (у каждого варианта свой выученный набор чисел).</li>
          <li><b>Выход</b> — карточка отряда (блок «Карточки отрядов»).</li>
          <li>Пустые слоты через сеть не проходят (флаг «пусто»).</li>
          <li>Весов немного: 62 × 256 + 256 × 256 ≈ 82 тыс. (вся нынешняя сеть отрядов — 3,8 млн).</li>
        </ul></div>
      </div>
    </div>
    <div class="side"><div><div class="colh">Открытые вопросы</div><div class="box"><ul class="small">
      <li>Размеры (256 чисел, 2 слоя) — подобрать замером при сборке.</li>
    </ul></div></div></div>
  </section>
</template>

<template id="tpl-armies">
  <section class="cards">
    <div>
      <div class="colh">Решено</div>
      <div class="box done">
        <h2>Слоты армий <span class="chip done">решено</span></h2>
        <div class="ginfo"><b>Общее</b>
        <ul class="small">
          <li><b>80 слотов: 40 наших + 40 врага, один слот — один отряд.</b> На поле у стороны не больше 40; подкрепления сверх 40 подходят по мере гибели прежних; призванные в лимит не входят. Пустые слоты — флаг «пусто», сеть их не читает.</li>
          <li><b>Всё от своей стороны:</b> «свой» — армия генерала; для второй стороны флаги меняются местами, как на карте.</li>
          <li><b>Только то, что известно до боя:</b> нет места, направления, состояния боя и видимости — вражеская армия перед боем видна целиком.</li>
          <li><b>Паспорт — итоговые характеристики с карточки</b> (ранг, предметы, навыки уже внутри). Чего на карточке нет — из базы или блок «Считаем сами».</li>
          <li><b>Свойства — три вида:</b> прибавки к себе — уже в итоговых числах; правила для себя — флагами в паспорте; эффекты на других, пассивки, эффекты при попадании — вход «Эффекты».</li>
          <li><b>Строй (ширина, глубина) — выход, а не вход:</b> генерал выбирает его при расстановке.</li>
        </ul></div>
        <details class="lgroup" open>
          <summary>Пример: наших 20 отрядов, врага 26</summary>
          <div class="slotsv">
            <div class="sside"><div class="sh"><b style="color:var(--mine)">Наши</b> <span class="small" data-scnt="m"></span></div><div class="slots" data-s="m"></div></div>
            <div class="sside"><div class="sh"><b style="color:var(--foe)">Враг</b> <span class="small" data-scnt="f"></span></div><div class="slots" data-s="f"></div></div>
          </div>
          <div class="leg small">
            <span><i class="sl sw2 m">Л</i>лорд</span><span><i class="sl sw2 m">Г</i>герой</span><span><i class="sl sw2 m">П</i>пехота</span><span><i class="sl sw2 m">С</i>стрелки</span><span><i class="sl sw2 m">А</i>артиллерия</span><span><i class="sl sw2 m">З</i>звери</span><span><i class="sl sw2 e"></i>пусто</span>
          </div>
          <div class="sdet small" data-sdet>Нажми на слот.</div>
        </details>
      </div>
      <div class="box">
        <h2>Правила входа «Армии»</h2>
        <ul class="small">
          <li><b>Новые отряды — только с известным типом.</b> Каждому отряду каста и размер назначаются из списка. Если у нового отряда касты или размера в списке нет — добавляем новый вариант (новый флаг с нулевыми весами, старые не меняются). Варианта «другое» нет: отряд с неизвестным типом — ошибка при сборке данных, а не тихое «другое».</li>
        </ul>
      </div>
      <div class="box done">
        <h2>Считаем сами <span class="chip done">решено</span></h2>
        <span class="small">Числа, которых нет на карточке готовыми: собираем или считаем по правилам игры. Здесь больше всего риск ошибиться — каждое проверяем пробой.</span>
        <ul class="small">
          <li><b>Кучность стрельбы</b> — итоговый разброс на 100 м = разброс оружия (зона и дистанция калибровки снаряда из базы) × (1 − (меткость + прибавка за ранг) / 100). Меткости на карточке нет. Проверить по пробе lonerank (ранг 0 против 9).</li>
          <li><b>Пассивки с карточки не брать.</b> Всегда действующие пассивки («Держать строй!», «Бешенство») карточка может уже включать в итоговые числа. Брать «Базовое + Ранг + постоянное „Другое“», строки пассивок отбрасывать — пассивки идут только через вход «Эффекты», иначе посчитаются дважды.</li>
          <li><b>Лидерство</b> — из строк подсказки: «Базовое» + «Ранг» + положительное «Другое»; строки ситуации боя («фланги», «лорд рядом», «Держать строй!») не берём. Верхнее число не годится: до пересчёта 0, после — с боевыми прибавками.</li>
          <li><b>Шаг и натиск</b> — из базы × та же поправка, что у бега на карточке (бег итоговый / бег из базы). Проверить допущение пробой из кампании (навык на скорость).</li>
          <li><b>Пришло в бой</b> — доля бойцов и доля здоровья от полного отряда: текущее с карточки / полное из паспорта.</li>
        </ul>
      </div>
